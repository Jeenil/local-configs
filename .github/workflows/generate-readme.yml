name: Generate bash command README

# Keeps "bash/README.md" in sync with the alias/function docs in Jeenil/configs's
# "bash/commands/" directory (and this repo's own bashrc_local.sh).

on:
  workflow_dispatch: {}
  schedule:
    # Runs every Monday at 09:00 UTC in case configs changed without a matching push here.
    - cron: "0 9 * * 1"
  push:
    branches:
      - main
    paths:
      - "bash/bashrc_local.sh"
      - "bash/generate-readme.py"
      - "bash/generate-readme.sh"

permissions:
  contents: write

jobs:
  generate-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout local-configs
        uses: actions/checkout@v4

      - name: Checkout configs
        uses: actions/checkout@v4
        with:
          repository: Jeenil/configs
          path: configs

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Regenerate bash/README.md
        env:
          CONFIGS_REPO_PATH: ${{ github.workspace }}/configs
        run: ./bash/generate-readme.sh

      - name: Commit and push if changed
        run: |
          if git diff --quiet -- bash/README.md; then
            echo "No changes to bash/README.md."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bash/README.md
          git commit -m "chore: regenerate bash/README.md"
          git push
